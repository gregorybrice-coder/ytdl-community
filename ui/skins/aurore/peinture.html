<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, HZ = Math.round(H * 0.5);   // horizon
const c = document.getElementById('c'), x = c.getContext('2d');

// Hasard reproductible.
let seed = 20261015;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
// Bruit de valeur lissé 1D.
const nt = Array.from({ length: 1024 }, rnd);
function noise(t) { const i = Math.floor(t), f = t - i, a = nt[i & 1023], b = nt[(i + 1) & 1023], s = f * f * (3 - 2 * f); return a + (b - a) * s; }
function fbm(t, o = 5) { let v = 0, a = .5, fq = 1; for (let k = 0; k < o; k++) { v += a * noise(t * fq + k * 37.1); a *= .5; fq *= 2.03; } return v; }
function layer() { const l = document.createElement('canvas'); l.width = W; l.height = H; return l; }

// ---------------------------------------------------------------- ciel
function sky(g) {
  const gr = g.createLinearGradient(0, 0, 0, HZ);
  gr.addColorStop(0, '#01030c'); gr.addColorStop(.35, '#04102a');
  gr.addColorStop(.75, '#0a2346'); gr.addColorStop(1, '#14466a');
  g.fillStyle = gr; g.fillRect(0, 0, W, HZ);
  // Voie lactée : nuage diagonal très doux.
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 900; i++) {
    const t = rnd(), px = W * (1.1 - t * 1.3) + (rnd() - .5) * 260, py = HZ * (t * .9) + (rnd() - .5) * 200;
    const r = 20 + rnd() * 90, gg = g.createRadialGradient(px, py, 0, px, py, r);
    gg.addColorStop(0, `rgba(${150 + rnd() * 60},${140 + rnd() * 50},255,.025)`); gg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gg; g.fillRect(px - r, py - r, r * 2, r * 2);
  }
  // Étoiles.
  for (let i = 0; i < 2600; i++) {
    const px = rnd() * W, py = Math.pow(rnd(), 1.25) * HZ * .98, m = rnd();
    const s = m > .995 ? 2.4 : m > .97 ? 1.5 : .5 + rnd() * .8, a = .35 + rnd() * .65;
    const tint = rnd(); const col = tint > .85 ? '255,220,190' : tint > .7 ? '190,215,255' : '255,255,255';
    g.fillStyle = `rgba(${col},${a * (1 - py / HZ * .5)})`;
    g.beginPath(); g.arc(px, py, s, 0, 7); g.fill();
    if (m > .993) { const gg = g.createRadialGradient(px, py, 0, px, py, 14); gg.addColorStop(0, `rgba(${col},.5)`); gg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gg; g.fillRect(px - 14, py - 14, 28, 28); }
  }
  g.restore();
}

// -------------------------------------------------------------- aurore
// Rideaux : une ligne de base ondulante, des rayons verticaux dont la
// hauteur et l'intensité varient, vert à la base, violet puis rose en haut.
function curtain(g, o) {
  for (let px = -40; px < W + 40; px += 1.2) {
    const u = px / W;
    const base = o.y + Math.sin(u * o.f1 + o.p1) * o.a1 + Math.sin(u * o.f2 + o.p2) * o.a2 + (fbm(u * 6 + o.s) - .5) * o.a3;
    const ray = Math.pow(fbm(u * o.rays + o.s * 3, 4), 2.2) * 2.4;            // stries
    const env = Math.pow(Math.max(0, Math.sin(Math.PI * Math.min(1, Math.max(0, (u - o.u0) / (o.u1 - o.u0))))), .7);
    const I = ray * env * o.i;
    if (I < .01) continue;
    const h = o.h * (.55 + fbm(u * 3 + o.s * 7) * .9);
    const gr = g.createLinearGradient(0, base, 0, base - h);
    gr.addColorStop(0, `rgba(170,255,220,${.0})`);
    gr.addColorStop(.04, `rgba(120,255,190,${.55 * I})`);
    gr.addColorStop(.22, `rgba(40,240,160,${.42 * I})`);
    gr.addColorStop(.5, `rgba(30,200,170,${.18 * I})`);
    gr.addColorStop(.75, `rgba(120,90,230,${.12 * I})`);
    gr.addColorStop(1, `rgba(230,80,200,0)`);
    g.fillStyle = gr; g.fillRect(px, base - h, 1.6, h + 6);
  }
}
function aurora() {
  const l = layer(), g = l.getContext('2d');
  g.globalCompositeOperation = 'lighter';
  curtain(g, { y: HZ * .62, h: 520, f1: 3.1, p1: .4, a1: 90, f2: 7.3, p2: 1.2, a2: 26, a3: 50, rays: 38, s: 1.3, u0: -.2, u1: 1.1, i: 1 });
  curtain(g, { y: HZ * .40, h: 420, f1: 2.2, p1: 2.1, a1: 120, f2: 9.1, p2: .3, a2: 20, a3: 60, rays: 52, s: 4.7, u0: .1, u1: 1.3, i: .75 });
  curtain(g, { y: HZ * .78, h: 300, f1: 4.4, p1: 4.0, a1: 40, f2: 11, p2: 2, a2: 12, a3: 30, rays: 70, s: 8.2, u0: -.3, u1: .8, i: .6 });
  // Halo : version floutée ajoutée sous les rayons nets.
  const b = layer(), bg = b.getContext('2d');
  bg.filter = 'blur(26px)'; bg.drawImage(l, 0, 0);
  const s = layer(), sg = s.getContext('2d');
  sg.filter = 'blur(1.5px)'; sg.drawImage(l, 0, 0);
  const out = layer(), og = out.getContext('2d');
  og.globalCompositeOperation = 'lighter';
  og.globalAlpha = 1.2; og.drawImage(b, 0, 0); og.drawImage(b, 0, 0);
  og.globalAlpha = 1; og.drawImage(s, 0, 0);
  return out;
}

// ----------------------------------------------------------- montagnes
function ridge(y0, amp, rough, s) {
  const pts = [];
  for (let px = 0; px <= W; px += 3) {
    const u = px / W;
    let v = 0, a = 1, f = 1;
    for (let k = 0; k < 7; k++) { v += a * (1 - Math.abs(noise(u * 3 * f + s + k * 11.3) * 2 - 1)); a *= rough; f *= 2.1; }
    pts.push([px, y0 - v * amp]);
  }
  return pts;
}
function mountains(g) {
  const ranges = [
    { y: HZ - 30, amp: 210, rough: .5, s: 3.3, fill: ['#0f2a47', '#0a1d33'], snow: .5 },
    { y: HZ - 4, amp: 150, rough: .48, s: 9.7, fill: ['#0b2038', '#071526'], snow: .35 },
    { y: HZ + 6, amp: 70, rough: .45, s: 17.1, fill: ['#06111f', '#040b16'], snow: 0 },
  ];
  for (const r of ranges) {
    const p = ridge(r.y, r.amp, r.rough, r.s);
    g.beginPath(); g.moveTo(0, HZ + 10); p.forEach(([a, b]) => g.lineTo(a, b)); g.lineTo(W, HZ + 10); g.closePath();
    const top = Math.min(...p.map(q => q[1]));
    const gr = g.createLinearGradient(0, top, 0, HZ); gr.addColorStop(0, r.fill[0]); gr.addColorStop(1, r.fill[1]);
    g.fillStyle = gr; g.fill();
    if (r.snow) {
      // Neige sur les crêtes, éclairée de vert par l'aurore.
      g.save(); g.clip();
      for (let i = 0; i < p.length - 1; i++) {
        const [a, b] = p[i], [, b2] = p[i + 1], slope = b2 - b;
        const depth = (14 + rnd() * 40) * (1 - (b - top) / (r.y - top + 1));
        if (depth < 3) continue;
        const gg = g.createLinearGradient(0, b, 0, b + depth);
        const lit = slope > 0 ? .55 : .25;
        gg.addColorStop(0, `rgba(200,255,235,${r.snow * lit})`); gg.addColorStop(1, 'rgba(160,230,220,0)');
        g.fillStyle = gg; g.fillRect(a, b, 3.2, depth);
      }
      g.restore();
    }
  }
}

// --------------------------------------------------- sapins et chalet
function pine(g, px, base, h, col) {
  g.fillStyle = col; g.beginPath(); g.moveTo(px, base - h);
  const tiers = 6;
  for (let i = 1; i <= tiers; i++) { const yy = base - h + h * i / tiers, w = h * .2 * (i / tiers) + 2; g.lineTo(px + w, yy); g.lineTo(px + w * .45, yy); }
  for (let i = tiers; i >= 1; i--) { const yy = base - h + h * i / tiers, w = h * .2 * (i / tiers) + 2; g.lineTo(px - w * .45, yy); g.lineTo(px - w, yy); }
  g.closePath(); g.fill(); g.fillRect(px - 1.5, base - 4, 3, 6);
}
function shore(g) {
  // Lisière de sapins sur la rive.
  for (let px = -10; px < W + 10; px += 6 + rnd() * 10) {
    const edge = Math.min(1, Math.min(px, W - px) / 260);
    const h = (18 + rnd() * 40) * (1.6 - edge * .9) + (px < 260 ? (260 - px) * .35 : 0);
    pine(g, px, HZ + 12, h, '#02070e');
  }
  g.fillStyle = '#02070e'; g.fillRect(0, HZ + 6, W, 10);
  // Chalet, fenêtre chaude.
  const cx = 760, cb = HZ + 12;
  g.fillStyle = '#03080f'; g.fillRect(cx, cb - 34, 60, 34);
  g.beginPath(); g.moveTo(cx - 8, cb - 32); g.lineTo(cx + 30, cb - 60); g.lineTo(cx + 68, cb - 32); g.fill();
  g.fillStyle = '#ffb35c'; g.fillRect(cx + 12, cb - 24, 10, 10); g.fillRect(cx + 38, cb - 24, 10, 10);
  g.save(); g.globalCompositeOperation = 'lighter';
  const gw = g.createRadialGradient(cx + 30, cb - 20, 0, cx + 30, cb - 20, 70);
  gw.addColorStop(0, 'rgba(255,170,80,.45)'); gw.addColorStop(1, 'rgba(255,140,60,0)');
  g.fillStyle = gw; g.fillRect(cx - 50, cb - 90, 160, 140); g.restore();
  // Fumée de la cheminée.
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 40; i++) {
    const t = i / 40, sx = cx + 48 + Math.sin(t * 5) * 14 + t * 40, sy = cb - 60 - t * 160, r = 6 + t * 26;
    const gs = g.createRadialGradient(sx, sy, 0, sx, sy, r); gs.addColorStop(0, `rgba(160,200,220,${.05 * (1 - t)})`); gs.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gs; g.fillRect(sx - r, sy - r, r * 2, r * 2);
  }
  g.restore();
}

// ------------------------------------------------------------ lac gelé
function lake(g, scene) {
  // Reflet : le haut de l'image retourné, ondulé par bandes, assombri.
  const ref = layer(), rg = ref.getContext('2d');
  for (let yy = 0; yy < H - HZ; yy += 2) {
    const src = HZ - yy * .92 - 2; if (src < 0) break;
    const off = Math.sin(yy * .11) * (.4 + yy * .004) + (noise(yy * .07) - .5) * yy * .012;
    rg.drawImage(scene, 0, src, W, 2, off, HZ + yy, W, 2);
  }
  g.save(); g.filter = 'blur(2px)'; g.globalAlpha = .75; g.drawImage(ref, 0, 0); g.restore();
  // Voile de glace et de profondeur.
  const gr = g.createLinearGradient(0, HZ, 0, H);
  gr.addColorStop(0, 'rgba(8,24,44,.25)'); gr.addColorStop(.35, 'rgba(6,18,34,.55)'); gr.addColorStop(1, 'rgba(3,9,18,.92)');
  g.fillStyle = gr; g.fillRect(0, HZ, W, H - HZ);
  // Craquelures et reflets de givre.
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 34; i++) {
    let px = rnd() * W, py = HZ + 30 + Math.pow(rnd(), .7) * (H - HZ - 30);
    const persp = (py - HZ) / (H - HZ);
    g.strokeStyle = `rgba(150,230,230,${.03 + persp * .05})`; g.lineWidth = .5 + persp * .8;
    g.beginPath(); g.moveTo(px, py);
    const dir = rnd() < .5 ? -1 : 1; for (let k = 0; k < 4; k++) { px += dir * (40 + rnd() * 90) * (persp + .3); py += (rnd() - .5) * 8 * (persp + .2); g.lineTo(px, py); }
    g.stroke();
  }
  // Lueur de l'aurore sur la glace.
  const glow = g.createRadialGradient(W * .45, HZ + 40, 0, W * .45, HZ + 40, 700);
  glow.addColorStop(0, 'rgba(60,255,180,.12)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = glow; g.fillRect(0, HZ, W, H - HZ);
  g.restore();
}

// --------------------------------------------------------- assemblage
const scene = layer(), sc = scene.getContext('2d');
sky(sc);
sc.globalCompositeOperation = 'lighter'; sc.drawImage(aurora(), 0, 0); sc.globalCompositeOperation = 'source-over';
// Lueur verte qui baigne l'horizon.
const hz = sc.createLinearGradient(0, HZ - 260, 0, HZ);
hz.addColorStop(0, 'rgba(40,220,160,0)'); hz.addColorStop(1, 'rgba(40,220,160,.12)');
sc.fillStyle = hz; sc.fillRect(0, HZ - 260, W, 260);
mountains(sc);
shore(sc);
x.drawImage(scene, 0, 0, W, HZ + 16, 0, 0, W, HZ + 16);
lake(x, scene);
x.drawImage(scene, 0, HZ - 80, W, 96, 0, HZ - 80, W, 96);   // rive nette par-dessus le reflet
// Grain de pellicule très fin.
const id = x.getImageData(0, 0, W, H), d = id.data;
for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * 7; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
x.putImageData(id, 0, 0);
document.title = 'done';
</script></body></html>
